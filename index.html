<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ankan Biswas | Black Gold Business Card</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #2a2a2a 0%, #111111 40%, #050505 100%);
      color: #f5e7b7;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(20,20,20,0.98), rgba(8,8,8,0.98));
      border: 1px solid rgba(212, 175, 55, 0.45);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    .hero {
      padding: 30px 22px 22px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(212,175,55,0.18) 0%, rgba(212,175,55,0.04) 70%, rgba(0,0,0,0) 100%);
      border-bottom: 1px solid rgba(212,175,55,0.18);
    }
    .avatar-ring {
      width: 184px;
      height: 184px;
      margin: 0 auto 18px;
      border-radius: 50%;
      padding: 7px;
      background: linear-gradient(135deg, #f4d77d, #b68a1f, #f4d77d);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }
    .avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #111111;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.08;
      color: #f6df95;
      font-weight: 800;
      letter-spacing: 0.01em;
      word-break: break-word;
    }
    .subtitle {
      margin: 10px 0 0;
      font-size: 18px;
      color: #d8bf6a;
      letter-spacing: 0.03em;
    }
    .content {
      padding: 24px 18px 28px;
    }
    .section-label {
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #cfa944;
      font-weight: 800;
      margin: 0 0 16px;
    }
    .info-box {
      display: block;
      text-decoration: none;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212,175,55,0.22);
      border-radius: 18px;
      padding: 15px 16px;
      margin-bottom: 12px;
      color: #f8edc4;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      overflow-wrap: anywhere;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    .actions {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px 16px;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .btn:active {
      transform: scale(0.99);
    }
    .btn-gold {
      background: linear-gradient(135deg, #f6df95, #c89b2a);
      color: #161616;
      box-shadow: 0 8px 20px rgba(200,155,42,0.25);
    }
    .btn-dark {
      background: #121212;
      color: #f1d57e;
      border: 1px solid rgba(212,175,55,0.35);
    }
    .helper {
      margin-top: 16px;
      color: #bfa76a;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }
    .divider {
      width: 84px;
      height: 3px;
      margin: 16px auto 0;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      opacity: 0.9;
    }
    @media (max-width: 480px) {
      .page { padding: 10px; }
      .card { border-radius: 22px; }
      .hero { padding: 24px 16px 18px; }
      .avatar-ring { width: 152px; height: 152px; margin-bottom: 15px; }
      h1 { font-size: 28px; }
      .subtitle { font-size: 16px; }
      .content { padding: 20px 14px 24px; }
      .info-box { font-size: 17px; }
    }
  </style>
</head>
