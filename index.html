<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ankan Biswas | Digital Business Card</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top left, #2a2a2a 0%, #111111 40%, #050505 100%);
      color: #f5e7b7;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(20,20,20,0.98), rgba(8,8,8,0.98));
      border: 1px solid rgba(212,175,55,0.45);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }

    .hero {
      padding: 30px 22px 22px;
      text-align: center;
      background: linear-gradient(
        180deg,
        rgba(212,175,55,0.18) 0%,
        rgba(212,175,55,0.04) 70%,
        rgba(0,0,0,0) 100%
      );
      border-bottom: 1px solid rgba(212,175,55,0.18);
    }

    .avatar-ring {
      width: 184px;
      height: 184px;
      margin: 0 auto 18px;
      border-radius: 50%;
      padding: 7px;
      background: linear-gradient(135deg, #f4d77d, #b68a1f, #f4d77d);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }

    .avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 15%;
      border-radius: 50%;
      border: 4px solid #111111;
      background: #111111;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.08;
      color: #f6df95;
      font-weight: 800;
      word-break: break-word;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 18px;
      color: #d8bf6a;
    }

    .content {
      padding: 24px 18px 28px;
    }

    .section-label {
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #cfa944;
      font-weight: 800;
      margin: 0 0 16px;
    }

    .info-box {
      display: block;
      text-decoration: none;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212,175,55,0.22);
      border-radius: 18px;
      padding: 15px 16px;
      margin-bottom: 12px;
      color: #f8edc4;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .btn {
      display: block;
      width: 100%;
      border-radius: 16px;
      padding: 15px 16px;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      background: #121212;
      color: #f1d57e;
      border: 1px solid rgba(212,175,55,0.35);
      transition: transform 0.15s ease;
    }

    button.btn {
      appearance: none;
      -webkit-appearance: none;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .qr-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(212,175,55,0.18);
      text-align: center;
    }

    .qr {
      width: 150px;
      height: 150px;
      display: block;
      margin: 0 auto 12px;
      padding: 8px;
      background: #fff;
      border-radius: 14px;
    }

    .helper {
      margin-top: 16px;
      color: #bfa76a;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card" id="captureCard">
      <div class="hero">
        <div class="avatar-ring">
          <img
            class="avatar"
            src="profile.jpg"
            onerror="this.src='assets/profile-placeholder.svg'"
            alt="Profile picture of Ankan Biswas"
          />
        </div>
        <h1>Ankan Biswas</h1>
        <p class="subtitle">Digital Business Card</p>
      </div>

      <div class="content">
        <p class="section-label">Contact</p>

        <a class="info-box" href="tel:+353871904178">📞 +353 871904178</a>
        <a class="info-box" href="mailto:ankan.biswas2710@gmail.com">✉️ ankan.biswas2710@gmail.com</a>

        <div class="actions">
          <button class="btn" onclick="saveCardAsImage()">Save Card to Gallery</button>
          <button class="btn" onclick="saveContact()">Save Contact</button>
          <a class="btn" href="https://coffee-shop-ecommerce.vercel.app/" target="_blank">View Sample Website 1</a>
          <a class="btn" href="https://your-coffee-shop.vercel.app/">View Sample Website 2</a>
        </div>

        <div class="qr-section">
          <img
            class="qr"
            src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://ankanbiswas.vercel.app/"
            alt="QR Code"
          />
          <p class="helper">Scan QR to open my digital business card.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    function saveContact() {
      const vcard = `BEGIN:VCARD
VERSION:3.0
N:Biswas;Ankan;;;
FN:Ankan Biswas
TEL;TYPE=CELL:+353 871904178
EMAIL:ankan.biswas2710@gmail.com
URL:https://ankanbiswas.vercel.app/
END:VCARD`;

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ankan_biswas_contact.vcf";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function saveCardAsImage() {
      const target = document.getElementById("captureCard");
      const canvas = await html2canvas(target, {
        backgroundColor: null,
        scale: 2,
        useCORS: true
      });

      const imageURL = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = imageURL;
      a.download = "ankan_biswas_business_card.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
</body>
</html>
