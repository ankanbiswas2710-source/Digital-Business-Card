<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ankan Biswas | Digital Business Card</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top left, #2a2a2a 0%, #111111 40%, #050505 100%);
      color: #f5e7b7;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(20,20,20,0.98), rgba(8,8,8,0.98));
      border: 1px solid rgba(212,175,55,0.45);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }

    .hero {
      padding: 28px 20px 20px;
      text-align: center;
      background: linear-gradient(
        180deg,
        rgba(212,175,55,0.18) 0%,
        rgba(212,175,55,0.05) 70%,
        rgba(0,0,0,0) 100%
      );
      border-bottom: 1px solid rgba(212,175,55,0.18);
    }

    .avatar-ring {
      width: 170px;
      height: 170px;
      margin: 0 auto 18px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #f4d77d, #b68a1f, #f4d77d);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }

    .avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 12%;
      border-radius: 50%;
      border: 4px solid #111111;
      background: #111111;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.08;
      color: #f6df95;
      font-weight: 800;
      word-break: break-word;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 17px;
      color: #d8bf6a;
    }

    .content {
      padding: 20px 16px 22px;
    }

    .section-label {
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #cfa944;
      font-weight: 800;
      margin: 0 0 14px;
    }

    .info-box {
      display: block;
      text-decoration: none;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212,175,55,0.22);
      border-radius: 16px;
      padding: 14px 14px;
      margin-bottom: 10px;
      color: #f8edc4;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      border-radius: 14px;
      padding: 14px 14px;
      text-decoration: none;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      background: #121212;
      color: #f1d57e;
      border: 1px solid rgba(212,175,55,0.35);
      transition: transform 0.15s ease;
    }

    button.btn {
      appearance: none;
      -webkit-appearance: none;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .qr-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(212,175,55,0.18);
      text-align: center;
    }

    .qr {
      width: 128px;
      height: 128px;
      display: block;
      margin: 0 auto 10px;
      padding: 8px;
      background: #fff;
      border-radius: 12px;
    }

    .helper {
      margin-top: 10px;
      color: #bfa76a;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .save-card {
      width: 760px;
      background: linear-gradient(180deg, #151515 0%, #050505 100%);
      color: #f5e7b7;
      border: 2px solid rgba(212,175,55,0.45);
      border-radius: 28px;
      padding: 34px 34px 28px;
      position: fixed;
      left: -99999px;
      top: 0;
      z-index: -1;
    }

    .save-top {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 24px;
    }

    .save-avatar-ring {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #f4d77d, #b68a1f, #f4d77d);
      flex-shrink: 0;
    }

    .save-avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 12%;
      border-radius: 50%;
      border: 4px solid #111111;
      background: #111111;
    }

    .save-text {
      flex: 1;
    }

    .save-name {
      margin: 0 0 10px;
      font-size: 50px;
      line-height: 1.05;
      color: #f6df95;
      font-weight: 800;
    }

    .save-subtitle {
      margin: 0;
      font-size: 28px;
      color: #d8bf6a;
    }

    .save-divider {
      height: 1px;
      background: rgba(212,175,55,0.25);
      margin: 18px 0 24px;
    }

    .save-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 28px;
    }

    .save-left {
      flex: 1;
    }

    .save-label {
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #cfa944;
      font-weight: 800;
      margin: 0 0 14px;
    }

    .save-contact {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 600;
      color: #f8edc4;
      line-height: 1.35;
      word-break: break-word;
    }

    .save-qr-wrap {
      text-align: center;
      flex-shrink: 0;
    }

    .save-qr {
      width: 180px;
      height: 180px;
      display: block;
      padding: 10px;
      background: #fff;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .save-qr-note {
      margin: 0;
      font-size: 18px;
      color: #d8bf6a;
    }

    @media (max-width: 480px) {
      .page { padding: 10px; }
      .card { border-radius: 22px; }
      .hero { padding: 24px 16px 18px; }
      .avatar-ring { width: 150px; height: 150px; }
      h1 { font-size: 28px; }
      .subtitle { font-size: 16px; }
      .info-box { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card" id="captureCard">
      <div class="hero">
        <div class="avatar-ring">
          <img
            class="avatar"
            src="profile.jpg"
            onerror="this.src='assets/profile-placeholder.svg'"
            alt="Profile picture of Ankan Biswas"
          />
        </div>
        <h1>Ankan Biswas</h1>
        <p class="subtitle">Digital Business Card</p>
      </div>

      <div class="content">
        <p class="section-label">Contact</p>

        <a class="info-box" href="tel:+353871904178">📞 +353 871904178</a>
        <a class="info-box" href="mailto:ankan.biswas2710@gmail.com">✉️ ankan.biswas2710@gmail.com</a>

        <div class="actions">
          <button id="saveCardBtn" class="btn" type="button">Save Card to Gallery</button>
          <button id="saveContactBtn" class="btn" type="button">Save Contact</button>
          <a class="btn" href="https://coffee-shop-ecommerce.vercel.app/" target="_blank" rel="noreferrer">View Sample Website 1</a>
          <a class="btn" href="https://your-coffee-shop.vercel.app/" target="_blank" rel="noreferrer">View Sample Website 2</a>
        </div>

        <div class="qr-section">
          <img id="qrCode" class="qr" alt="QR Code" />
          <p class="helper">Scan QR to open my digital business card.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="save-card" id="saveCardLayout">
    <div class="save-top">
      <div class="save-avatar-ring">
        <img
          class="save-avatar"
          src="profile.jpg"
          onerror="this.src='assets/profile-placeholder.svg'"
          alt="Profile picture of Ankan Biswas"
        />
      </div>

      <div class="save-text">
        <h2 class="save-name">Ankan Biswas</h2>
        <p class="save-subtitle">Digital Business Card</p>
      </div>
    </div>

    <div class="save-divider"></div>

    <div class="save-bottom">
      <div class="save-left">
        <p class="save-label">Contact</p>
        <p class="save-contact">📞 +353 871904178</p>
        <p class="save-contact">✉️ ankan.biswas2710@gmail.com</p>
      </div>

      <div class="save-qr-wrap">
        <img id="saveQrCode" class="save-qr" alt="QR Code" />
        <p class="save-qr-note">Scan to open card</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
